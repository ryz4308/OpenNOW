name: Resilience v4 interface-safe build

# Custom diagnostic build: Fast Burst Recovery, absolute pointer guard,
# compositor-safe presentation, smooth playout buffering, queue ETA,
# and diagnostics export v6.

on:
  workflow_dispatch:
  push:
    branches:
      - opennow-resilience-v3

permissions:
  contents: read

concurrency:
  group: resilience-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 portable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: opennow-stable
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      npm_config_audit: "false"
      npm_config_fund: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opennow-stable/package-lock.json

      - name: Use HTTPS for public GitHub npm dependencies
        working-directory: .
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The upstream full suite currently contains a Windows path-separator
      # assertion in GameCard.test.ts that is unrelated to this build. The
      # complete 635-test suite is still run locally; keep Windows CI focused
      # on every subsystem touched by this diagnostic branch.
      - name: Test resilience changes
        run: node --import tsx --test src/shared/gfn/settings.test.ts src/renderer/src/platforms/gfn/webrtc/absolutePointerCoordinateGuard.test.ts src/renderer/src/platforms/gfn/webrtc/domInputCaptureController.test.ts src/renderer/src/platforms/gfn/webrtc/controllers.test.ts src/renderer/src/utils/diagnosticsRecorder.test.ts

      - name: Check source locale
        run: npm run locales:check

      - name: Build Electron app
        run: npm run build

      - name: Verify complete renderer CSS before packaging
        run: node scripts/verify-packaged-styles.mjs dist/index.html

      - name: Package portable Windows test build
        run: npx electron-builder --publish never --win portable --x64

      - name: Verify complete renderer CSS inside app.asar
        run: node scripts/verify-packaged-styles.mjs dist-release/win-unpacked/resources/app.asar

      - name: Give the test executable an unmistakable name
        shell: pwsh
        run: |
          $source = Get-ChildItem dist-release\*-portable-x64.exe | Select-Object -First 1
          if (-not $source) { throw "Portable executable was not produced." }
          Copy-Item $source.FullName dist-release\OpenNOW-resilience-v4-interface-restored-portable-x64.exe

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-resilience-v4-interface-restored-windows-x64
          path: opennow-stable/dist-release/OpenNOW-resilience-v4-interface-restored-portable-x64.exe
          if-no-files-found: error
          retention-days: 14
